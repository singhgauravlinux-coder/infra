    <stop offset="100%" stop-color="#eef2f7"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
  </radialGradient>
</defs>
