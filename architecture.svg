<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="949" height="658" viewBox="0 0 949 658" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style><![CDATA[
  /* Motion-only animation: no element is ever fully transparent, so a single static
     screenshot (PR diffs, blob preview thumbnails, etc.) always shows the complete
     diagram -- only continuously-looping subtle motion is time-dependent. */
  .floatAll { animation: floatY 5s ease-in-out infinite; }
  .layerIn {
    animation: settleIn 1s cubic-bezier(.22,.61,.36,1) both, bob 4.2s ease-in-out 1s infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  .pulseDot {
    animation: pulseDot 2.4s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center;
  }
  @keyframes settleIn {
    0%   { transform: translateY(14px); }
    100% { transform: translateY(0); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2.5px); }
  }
  @keyframes floatY {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-7px); }
  }
  @keyframes pulseDot {
    0%, 100% { transform: scale(1);   opacity: 1; }
    50%      { transform: scale(1.7); opacity: 0.65; }
  }
]]></style>

